ServerName localhost

# The code links to /AstroMaze/... (XAMPP layout). This makes both
# https://your-app/ and https://your-app/AstroMaze/ work.
Alias /AstroMaze /var/www/html

<Directory /var/www/html>
    AllowOverride None
    Require all granted
</Directory>

# Never serve repo/database files
<FilesMatch "\.(sql|md)$">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.git">
    Require all denied
</DirectoryMatch>

# Uploaded files must never be executed as PHP
<Directory /var/www/html/uploads>
    <FilesMatch "\.php[0-9]?$">
        Require all denied
    </FilesMatch>
</Directory>
